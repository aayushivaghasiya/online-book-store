<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookNest Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="container admin-page"><a href="/">← Back to store</a><h1>BookNest Admin</h1><p class="muted">Demo inventory viewer for the WAD project.</p><div id="adminBooks" class="book-grid"></div></main><script>fetch('/api/books').then(r=>r.json()).then(books=>{document.getElementById('adminBooks').innerHTML=books.map(b=>`<article class="admin-row"><img src="${b.image}" alt=""><div><b>${b.title}</b><p>${b.author} · ${b.category}</p></div><strong>₹${b.price}</strong><span>Stock: ${b.stock}</span></article>`).join('')})</script></body></html>
